version: '3'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    image: pingmaster-api:latest
    restart: always
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8000:8000"  # nginx only
    volumes:
      - ./data:/app/data
      - ./.env.prod:/app/.env.prod

    user: "${UID}:${GID}"
    networks:
      - api_network
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

networks:
  api_network:
    driver: bridge